privacy_policy:
  title: 'Política de Privacidad'
  meta_desc: 'Conozca la Política de Privacidad de Pressmatik y cómo tratamos sus datos con transparencia y seguridad.'
  intro: 'Pressmatik Prensas y Equipos Industriales valora la privacidad, confidencialidad y seguridad de los datos de sus clientes, socios y visitantes. Este documento detalla las prácticas de tratamiento de la información recopilada a través de nuestro sitio web.'
  s1_title: '1. Información Recopilada'
  s1_text: 'Recopilamos exclusivamente la información facilitada voluntariamente por usted al utilizar nuestros canales de contacto y formularios de cotización técnica: nombre completo, correo electrónico corporativo, teléfono/WhatsApp, empresa, identificación fiscal (cuando se proporcione), producto de interés y notas adicionales.'
  s2_title: '2. Finalidad del Uso de los Datos'
  s2_text: 'Los datos recopilados se destinan estrictamente a la atención comercial y técnica de sus solicitudes, envío de propuestas de ingeniería, resolución de dudas sobre nuestra maquinaria y prestación de soporte técnico posventa.'
  s3_title: '3. Almacenamiento y Seguridad'
  s3_text: 'Adoptamos rigurosos estándares de seguridad informática, con transmisión de datos cifrada mediante protocolo SSL/HTTPS. Sus datos se almacenan en entornos seguros bajo estricto control de acceso y nunca se comercializan, alquilan ni comparten con terceros con fines publicitarios.'
  s4_title: '4. Cookies y Tecnologías de Navegación'
  s4_text: 'Nuestro sitio utiliza cookies y almacenamiento local exclusivamente para fines operativos y de usabilidad, como guardar su preferencia de tema visual (claro/oscuro) y garantizar la seguridad de la sesión (tokens anti-CSRF). No utilizamos cookies invasivas de seguimiento publicitario de terceros.'
  s5_title: '5. Derechos del Titular'
  s5_text: 'De conformidad con la legislación de protección de datos aplicable (LGPD y estándares internacionales), el titular tiene derecho a solicitar la confirmación del tratamiento, el acceso a sus datos, la corrección de datos inexactos y la eliminación definitiva de nuestra base de contactos.'
  s6_title: '6. Canal de Atención'
  s6_text: 'Para ejercer sus derechos de privacidad o resolver cualquier consulta referente a esta política, comuníquese con nuestro equipo por correo a comercial@pressmatik.com.br o al teléfono +55 (16) 3014-8368.'
  last_updated: 'Última actualización: Septiembre de 2026.'
terms_of_use:
  title: 'Términos de Uso'
  meta_desc: 'Términos y condiciones generales de navegación y uso del sitio web de Pressmatik Prensas y Equipos Industriales.'
  intro: 'Al acceder y navegar por el sitio web de Pressmatik, el usuario declara aceptar y adherirse a estos Términos de Uso. Si no está de acuerdo con alguna de las condiciones, le recomendamos interrumpir la navegación.'
  s1_title: '1. Finalidad del Sitio Web'
  s1_text: 'El sitio web de Pressmatik tiene por objeto la presentación corporativa de la empresa, difusión técnica de su catálogo de prensas industriales, equipos pesados y servicios de mantenimiento, además de ofrecer canales directos para la solicitud de propuestas comerciales.'
  s2_title: '2. Propiedad Intelectual'
  s2_text: 'Todos los contenidos mostrados en este sitio web —incluidos textos, especificaciones técnicas, fotografías, logotipos, esquemas y código fuente— son propiedad exclusiva de Pressmatik o cuentan con las debidas licencias, protegidos por las leyes de propiedad industrial y derechos de autor. Queda prohibida su reproducción, modificación o redistribución sin autorización previa por escrito.'
  s3_title: '3. Parámetros y Especificaciones Técnicas'
  s3_text: 'Las especificaciones técnicas, tablas dimensionales y capacidades expuestas tienen carácter informativo. Debido a la continua evolución de nuestros proyectos de ingeniería y a las posibilidades de personalización según las necesidades de cada fábrica, los parámetros finales deberán validarse siempre mediante propuesta comercial formal emitida por nuestros especialistas.'
  s4_title: '4. Limitación de Responsabilidad'
  s4_text: 'Pressmatik realiza sus mejores esfuerzos para garantizar la exactitud y disponibilidad continua de la información. Sin embargo, no se hace responsable de posibles interrupciones técnicas temporales, inestabilidad de la red o fallas ajenas al control razonable de la empresa.'
  s5_title: '5. Legislación Aplicable y Jurisdicción'
  s5_text: 'Estos términos se rigen por las leyes de la República Federativa de Brasil. Se designa la jurisdicción de la Ciudad de Araraquara, Estado de São Paulo, Brasil, para dirimir cualquier controversia derivada del uso de este sitio web.'
  last_updated: 'Última actualización: Septiembre de 2026.'
